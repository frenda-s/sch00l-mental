name = "school-mental-health"
main = "src/server/index.ts"
compatibility_date = "2024-11-27"

# Turso biến môi trường — lấy qua `wrangler secret put` hoặc .dev.vars (local).
# Không commit giá trị thật vào repo.
[vars]
APP_ENV = "production"

[assets]
directory = "./dist"
binding = "ASSETS"
not_found_handling = "single-page-application"
run_worker_first = true

# Secrets (đặt qua: wrangler secret put TURSO_DATABASE_URL / TURSO_AUTH_TOKEN / SESSION_SECRET)
# hoặc .dev.vars khi chạy local. KHÔNG khai báo giá trị thật ở đây.
